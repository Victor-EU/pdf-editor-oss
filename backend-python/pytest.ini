[pytest]
# Pytest Configuration for PDF Editor

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Show captured output on failures
    --tb=short
    # Coverage options
    --cov=services
    --cov=routers
    --cov=config
    --cov=scheduler
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Parallel execution (8 workers)
    -n auto
    # Show slowest 10 tests
    --durations=10
    # Strict markers
    --strict-markers
    # Warnings
    -W ignore::DeprecationWarning

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires external resources)
    slow: Slow tests (may take several seconds)
    cleanup: Tests for file cleanup service
    pdf: Tests for PDF processing services
    api: Tests for API endpoints
    smoke: Smoke tests (critical path)
    skip_ci: Skip in CI environment

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
