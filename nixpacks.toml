[phases.setup]
nixPkgs = [
  "python311",
  "python311Packages.pip",
  "ghostscript",
  "poppler_utils",
  "tesseract",
  "opencv4"
]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "cd backend-python && pip install -r requirements.txt"
]

[phases.build]
cmds = ["echo 'Build complete'"]

[start]
cmd = "cd backend-python && python main.py"
